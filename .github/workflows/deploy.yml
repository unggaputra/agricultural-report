name: Deploy ke InfinityFree

on:
  push:
    branches:
      - main  # Sesuaikan jika branch utama kamu bernama 'master'

jobs:
  web-deploy:
    name: Build & Upload via FTP
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode terbaru
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install Dependensi Composer
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Setup Node.js & Build Assets
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          if [ -f package.json ]; then
            npm ci
            npm run build
          fi

      - name: Sinkronisasi file ke server FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
